<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 200" width="100%" height="100%">
  <defs>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161b22" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#0d1117" stop-opacity="0.98"/>
      <stop offset="100%" stop-color="#101827" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="100%" stop-color="#00FF9D"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7928CA"/>
      <stop offset="100%" stop-color="#FF0080"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#30363d" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#00FF9D" stop-opacity="0.5"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 20px; font-weight: 700; fill: #FFFFFF; letter-spacing: 0.5px; }
    .subtitle { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 13px; font-weight: 500; fill: #8B949E; }
    .stat-val { font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 14px; font-weight: 600; fill: #E6EDF3; }
    .stat-label { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 11px; font-weight: 500; fill: #7D8590; text-transform: uppercase; letter-spacing: 0.8px; }
    .badge-txt { font-family: 'JetBrains Mono', 'Fira Code', monospace; font-size: 11px; font-weight: 600; fill: #00F0FF; }
  </style>

  <!-- Background Base with Glow Border -->
  <rect x="2" y="2" width="876" height="196" rx="16" fill="url(#cardGrad)" stroke="url(#borderGrad)" stroke-width="1.5"/>

  <!-- Top Accent Bar -->
  <path d="M 18 2 L 120 2 Q 130 2 135 7 L 145 18 L 862 18 Q 876 18 876 32" fill="none" stroke="url(#cyanGrad)" stroke-width="2" opacity="0.8"/>

  <!-- Pulse Status Dot -->
  <circle cx="34" cy="34" r="5" fill="#00FF9D" filter="url(#glow)"/>
  <circle cx="34" cy="34" r="3" fill="#FFFFFF"/>

  <!-- Status Pill -->
  <rect x="48" y="23" width="310" height="22" rx="11" fill="#00F0FF" fill-opacity="0.08" stroke="#00F0FF" stroke-opacity="0.3" stroke-width="1"/>
  <text x="58" y="38" class="badge-txt">DAYANANDA SAGAR UNIVERSITY • AI &amp; ML '29</text>

  <!-- Main Headline -->
  <text x="32" y="78" class="title">Sathvik R <tspan fill="url(#cyanGrad)">— Engineering from First Principles</tspan></text>
  <text x="32" y="98" class="subtitle">Pioneering at the cross-section of Artificial Intelligence, Cybersecurity, Systems, &amp; Automotive Engineering.</text>

  <!-- 4-Column Stat Bento Bar -->
  <g transform="translate(32, 120)">
    <!-- Column 1 -->
    <rect x="0" y="0" width="190" height="58" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <circle cx="20" cy="29" r="10" fill="#00F0FF" fill-opacity="0.1"/>
    <text x="20" y="33" text-anchor="middle" font-size="12" fill="#00F0FF">🎓</text>
    <text x="38" y="24" class="stat-label">Academic Track</text>
    <text x="38" y="44" class="stat-val">DSU Bangalore • High CGPA</text>

    <!-- Column 2 -->
    <rect x="204" y="0" width="190" height="58" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <circle cx="224" cy="29" r="10" fill="#00FF9D" fill-opacity="0.1"/>
    <text x="224" y="33" text-anchor="middle" font-size="12" fill="#00FF9D">🚀</text>
    <text x="242" y="24" class="stat-label">Career Target</text>
    <text x="242" y="44" class="stat-val">AI / ML Engineer</text>

    <!-- Column 3 -->
    <rect x="408" y="0" width="190" height="58" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <circle cx="428" cy="29" r="10" fill="#FF0080" fill-opacity="0.1"/>
    <text x="428" y="33" text-anchor="middle" font-size="12" fill="#FF0080">🌐</text>
    <text x="446" y="24" class="stat-label">Global Ambition</text>
    <text x="446" y="44" class="stat-val">Germany 🇩🇪 &amp; USA 🇺🇸</text>

    <!-- Column 4 -->
    <rect x="612" y="0" width="202" height="58" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <circle cx="632" cy="29" r="10" fill="#FFB800" fill-opacity="0.1"/>
    <text x="632" y="33" text-anchor="middle" font-size="12" fill="#FFB800">🏎️</text>
    <text x="650" y="24" class="stat-label">Content Creation</text>
    <text x="650" y="44" class="stat-val">Auto Tech • DaVinci Resolve</text>
  </g>
</svg>
